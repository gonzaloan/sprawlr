[package]
name = "sprawlr-app"
description = "Use cases and ports: what sprawlr does, independent of where data comes from"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sprawlr-domain = { path = "../sprawlr-domain" }
sprawlr-iac = { path = "../sprawlr-iac" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"

[dev-dependencies]
sprawlr-domain = { path = "../sprawlr-domain", features = ["fixtures"] }
tokio = { version = "1", features = ["macros", "rt"] }
serde_json = "1"

[features]
# In-memory adapter serving the fictional demo account.
demo = ["sprawlr-domain/fixtures"]
