[package]
name = "sprawlr-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "sprawlr"
path = "src/main.rs"

[dependencies]
sprawlr-core = { path = "../sprawlr-core" }
sprawlr-scan = { path = "../sprawlr-scan", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["ec2"]
ec2 = ["sprawlr-scan/ec2"]
