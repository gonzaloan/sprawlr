[package]
name = "sprawlr-fs"
description = "File-system adapters: snapshot store, and writing documentation and exports"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sprawlr-domain = { path = "../sprawlr-domain" }
sprawlr-app = { path = "../sprawlr-app" }
sprawlr-docs = { path = "../sprawlr-docs" }
sprawlr-iac = { path = "../sprawlr-iac" }
anyhow = "1"
chrono = "0.4"
serde_json = "1"

[dev-dependencies]
sprawlr-domain = { path = "../sprawlr-domain", features = ["fixtures"] }
