[package]
name = "sprawlr-iac"
description = "Terraform and CloudFormation written from resources' live configuration, without I/O"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sprawlr-domain = { path = "../sprawlr-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sprawlr-domain = { path = "../sprawlr-domain", features = ["fixtures"] }
