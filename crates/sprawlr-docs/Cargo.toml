[package]
name = "sprawlr-docs"
description = "Markdown and Mermaid documentation rendered from a snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sprawlr-domain = { path = "../sprawlr-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sprawlr-domain = { path = "../sprawlr-domain", features = ["fixtures"] }
chrono = "0.4"
