[workspace]
resolver = "2"
# Hexagonal layout (see docs/architecture.md):
#   domain  <- app (ports + use cases) <- adapters (aws, fs, docs) <- drivers (cli, desktop)
members = [
  "crates/sprawlr-domain",
  "crates/sprawlr-app",
  "crates/sprawlr-docs",
  "crates/sprawlr-aws",
  "crates/sprawlr-fs",
  "crates/sprawlr-cli",
  "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gonzaloan/sprawlr"
rust-version = "1.90"

# aws-sdk-ec2 is huge; keep dependency builds lean.
[profile.dev.package."*"]
debug = false
