# Publishes the web demo (fictional account, no AWS) to GitHub Pages on every push to main.
name: Demo

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      # Served from https://gonzaloan.github.io/sprawlr/, so assets live under /sprawlr/.
      - run: npm run build -- --base /sprawlr/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  # Only this job can publish, and it runs no code from the repository.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
