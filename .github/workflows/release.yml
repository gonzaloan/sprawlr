# Builds the desktop installers for macOS, Windows and Linux.
# - A tag like v0.2.0 opens a draft release with them; check it, then publish it by hand.
# - A pull request that changes the build (this file, the Tauri config, Cargo.toml or Cargo.lock)
#   builds and checks everything without releasing. So does a manual run.
# Actions are pinned to commits because people install these files; Dependabot keeps them current.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - app/src-tauri/tauri.conf.json
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-latest, target: x86_64-apple-darwin }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      # aws-sdk-ec2 needs a lot of memory; fewer parallel jobs keeps the smaller runners alive.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          npm_version=$(node -p "require('./app/package.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          for v in "$npm_version" "$cargo_version"; do
            test "${GITHUB_REF_NAME#v}" = "$v" || { echo "Tag $GITHUB_REF_NAME does not match version $v (package.json $npm_version, Cargo.toml $cargo_version)"; exit 1; }
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      # Pull requests only: a release is always built from scratch, so no cached code ends up in an installer.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: github.event_name == 'pull_request'
        with:
          key: ${{ matrix.target }}

      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci
        working-directory: app
      - run: npx tauri build --target ${{ matrix.target }}
        working-directory: app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprawlr-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe

  # Runs on every event, so a dry run checks the same files a release would upload.
  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Every installer is there
        run: |
          mkdir dist
          find artifacts -type f -exec mv {} dist/ \;
          ls -l dist
          for pattern in '*_aarch64.dmg' '*_x64.dmg' '*.deb' '*.rpm' '*.AppImage' '*.msi' '*-setup.exe'; do
            test "$(find dist -name "$pattern" | wc -l)" -eq 1 || { echo "Expected one $pattern"; exit 1; }
          done
          test "$(ls dist | wc -l)" -eq 7 || { echo "Expected exactly 7 installers"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: dist/

  # Only this job can write to the repository, and it runs no code from it.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Download the installer for your system: `.dmg` for macOS (`aarch64` for Apple silicon, `x64` for Intel), `-setup.exe` or `.msi` for Windows, `.AppImage`, `.deb` or `.rpm` for Linux. `SHA256SUMS` lists each file's checksum.

          The builds are not signed with a developer certificate yet. See [Install](https://github.com/gonzaloan/sprawlr#install) for how to open them.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "sprawlr $GITHUB_REF_NAME" --notes-file notes.md
