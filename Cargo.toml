[workspace]
resolver = "2"
# Hexagonal layout (see docs/architecture.md):
#   domain (+ docs, iac: pure renderers) <- app (ports + use cases) <- adapters (aws, fs) <- drivers (cli, desktop, mcp)
members = [
  "crates/sprawlr-domain",
  "crates/sprawlr-app",
  "crates/sprawlr-docs",
  "crates/sprawlr-iac",
  "crates/sprawlr-aws",
  "crates/sprawlr-fs",
  "crates/sprawlr-cli",
  "crates/sprawlr-mcp",
  "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gonzaloan/sprawlr"
rust-version = "1.94.1"

# aws-sdk-ec2 is huge; keep dependency builds lean.
[profile.dev.package."*"]
debug = false

[profile.release]
strip = true

# Optimising the EC2 SDK hardly speeds up a scan and needs more memory than some CI runners have.
[profile.release.package.aws-sdk-ec2]
opt-level = 1
