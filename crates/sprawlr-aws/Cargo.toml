[package]
name = "sprawlr-aws"
description = "AWS adapter: discovery, health and error logs for sprawlr's ports"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sprawlr-domain = { path = "../sprawlr-domain" }
sprawlr-app = { path = "../sprawlr-app" }
anyhow = "1"
chrono = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sts = "1"
aws-sdk-ec2 = { version = "1", optional = true }
aws-sdk-lambda = "1"
aws-sdk-cloudcontrol = "1"
aws-sdk-resourcegroupstagging = "1"
aws-sdk-sns = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-apigateway = "1"
aws-sdk-apigatewayv2 = "1"
aws-sdk-iam = "1"
aws-credential-types = "1"
aws-sdk-cloudwatchlogs = "1"
percent-encoding = "2"
aws-sdk-cloudwatch = "1"
aws-sdk-xray = "1"

[features]
# EC2 SDK is very heavy to compile (~10 GB RAM); network scanning lives behind this flag.
default = ["ec2"]
ec2 = ["dep:aws-sdk-ec2"]
