[package]
name = "sprawlr-fs"
description = "File-system adapters: snapshot store and documentation writer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sprawlr-domain = { path = "../sprawlr-domain" }
sprawlr-app = { path = "../sprawlr-app" }
sprawlr-docs = { path = "../sprawlr-docs" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
sprawlr-domain = { path = "../sprawlr-domain", features = ["fixtures"] }
