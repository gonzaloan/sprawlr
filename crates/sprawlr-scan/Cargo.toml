[package]
name = "sprawlr-scan"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
sprawlr-core = { path = "../sprawlr-core" }
anyhow = "1"
chrono = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sts = "1"
aws-sdk-ec2 = { version = "1", optional = true }
aws-sdk-lambda = "1"
aws-sdk-cloudcontrol = "1"
aws-sdk-resourcegroupstagging = "1"
aws-sdk-sns = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-apigateway = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-xray = "1"

[features]
# EC2 SDK is very heavy to compile (~10 GB RAM); network scanning lives behind this flag.
default = ["ec2"]
ec2 = ["dep:aws-sdk-ec2"]
