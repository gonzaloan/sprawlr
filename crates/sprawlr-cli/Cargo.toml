[package]
name = "sprawlr-cli"
description = "Command line driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sprawlr"
path = "src/main.rs"

[dependencies]
sprawlr-domain = { path = "../sprawlr-domain" }
sprawlr-app = { path = "../sprawlr-app", features = ["demo"] }
sprawlr-aws = { path = "../sprawlr-aws", default-features = false }
sprawlr-docs = { path = "../sprawlr-docs" }
sprawlr-fs = { path = "../sprawlr-fs" }
sprawlr-iac = { path = "../sprawlr-iac" }
chrono = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["ec2"]
ec2 = ["sprawlr-aws/ec2"]
